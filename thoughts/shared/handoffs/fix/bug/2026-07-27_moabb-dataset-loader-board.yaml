    - "Song2026 is the sole registered loader without staged data; its official release is Baidu-only and the loader marks it needs-data."

diagnosis:
  root_cause: >-
    Several loaders contacted remote APIs before checking complete local data;
    Shin2022 and Ding2025 emitted keys that violated MOABB's integer-leading
    session/run contract; Ma2022 did not use the staged five-session EDF
    release; SensoryGuidedMI2026 treated group-local subject IDs as global and
    had event/codebook issues.
  hypothesis: >-
    Preferring validated local paths, assigning stable group-scoped identities,
    and enforcing MOABB key/event contracts before paradigm preprocessing
    resolves both offline and real-data failures.
  files:
    - moabb/datasets/ma2022.py
    - moabb/datasets/sensoryguidedmi2026.py
    - moabb/datasets/jia2019.py
    - moabb/datasets/perezblanco2026.py
    - moabb/datasets/sun2026.py
    - moabb/datasets/shin2022.py
    - moabb/datasets/ding2025.py
    - moabb/datasets/garro2025.py

fix:
  approach: >-
    Added and registered 59 imagery loaders; preferred complete local caches;
    retained public fallbacks; corrected subject, event, session, and run
    mappings; added focused regression coverage; and checksum-synchronized
    the 69 production files with Jean Zay.
  files_modified:
