issue:
  description: >-
    Finish the MOABB imagery-dataset expansion board: wire Ma2022 to local
    EDF data, validate and register SensoryGuidedMI2026 as dataset 120,
    repair offline/cache and MOABB key-contract failures, rerun the loader
    smoke matrix, synchronize local and Jean Zay source, and commit.
  evidence:
